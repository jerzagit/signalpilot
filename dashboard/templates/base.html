<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <title>{% block title %}SignalPilot{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/portal.css">
  <link rel="stylesheet" href="/static/css/calendar.css">
  <script>
    (function () {
      if (localStorage.getItem('signalpilot-theme') === 'light') document.documentElement.classList.add('light');
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body class="portal-body">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="dot-pattern" aria-hidden="true"></div>
  <div class="market-backdrop" id="market-backdrop" aria-hidden="true">
    <svg class="market-chart" viewBox="0 0 1440 780" preserveAspectRatio="none">
      <defs>
        <linearGradient id="chartLine" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="currentColor" stop-opacity="0"/>
          <stop offset=".45" stop-color="currentColor" stop-opacity=".42"/>
          <stop offset="1" stop-color="currentColor" stop-opacity=".06"/>
        </linearGradient>
        <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="currentColor" stop-opacity=".09"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path class="profit-fill" d="M0 680 L110 652 L205 670 L310 590 L405 612 L510 522 L600 548 L705 420 L800 463 L905 344 L1000 372 L1110 245 L1205 282 L1310 145 L1440 182 L1440 780 L0 780 Z"/>
      <path class="profit-line glow-line" pathLength="1" d="M0 680 L110 652 L205 670 L310 590 L405 612 L510 522 L600 548 L705 420 L800 463 L905 344 L1000 372 L1110 245 L1205 282 L1310 145 L1440 182"/>
      <path class="profit-line bright-line" pathLength="1" d="M0 680 L110 652 L205 670 L310 590 L405 612 L510 522 L600 548 L705 420 L800 463 L905 344 L1000 372 L1110 245 L1205 282 L1310 145 L1440 182"/>
      <g class="candles">
        <path d="M190 584v96M178 610h24v45h-24zM382 520v108M370 548h24v52h-24zM578 448v115M566 473h24v61h-24zM780 370v112M768 398h24v56h-24zM982 286v105M970 310h24v54h-24zM1180 193v108M1168 220h24v53h-24z"/>
      </g>
    </svg>
    <div class="bullseye">
      <span class="orbit orbit-one"></span>
      <span class="orbit orbit-two"></span>
      <span class="orbit orbit-three"></span>
      <span class="bull-core"><i></i></span>
      <span class="target-cross cross-x"></span>
      <span class="target-cross cross-y"></span>
    </div>
  </div>

  <header class="portal-topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <a class="brand" href="/" aria-label="SignalPilot home">
          <span class="brand-mark" aria-hidden="true"><img src="/static/img/sp-mark.svg" alt=""><i></i></span>
          <span class="brand-name">Signal<span>Pilot</span></span>
        </a>
        <nav class="desktop-nav" aria-label="Main navigation">
          <a class="nav-link {% if active_nav == 'calendar' %}active{% endif %}" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar
          </a>
          <a class="nav-link {% if active_nav == 'trades' %}active{% endif %}" href="/trades">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>Trades
          </a>
        </nav>
      </div>
      <div class="topbar-right">
        <span class="live-chip"><span class="live-dot" aria-hidden="true"></span>XAUUSD<span class="chip-divider"></span>AUTO {{ "ON" if autotrade else "OFF" }}</span>
        <span class="account-chip"><strong>{{ mode }}</strong><span>{{ account }}</span></span>
        <button class="icon-button" type="button" id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <button class="icon-button menu-toggle" type="button" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
      <a class="nav-link {% if active_nav == 'calendar' %}active{% endif %}" href="/">Calendar</a>
      <a class="nav-link {% if active_nav == 'trades' %}active{% endif %}" href="/trades">Trades</a>
    </nav>
  </header>

  <main class="portal-content">{% block content %}{% endblock %}</main>

  <script>
    (function () {
      const root = document.documentElement;
      const theme = document.getElementById('theme-toggle');
      const menu = document.getElementById('menu-toggle');
      const mobileNav = document.getElementById('mobile-nav');
      theme?.addEventListener('click', () => {
        root.classList.toggle('light');
        localStorage.setItem('signalpilot-theme', root.classList.contains('light') ? 'light' : 'dark');
      });
      menu?.addEventListener('click', () => {
        const open = mobileNav.classList.toggle('open');
        menu.setAttribute('aria-expanded', String(open));
      });

      const backdrop = document.getElementById('market-backdrop');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (backdrop && !reducedMotion.matches) {
        window.addEventListener('pointermove', event => {
          const x = (event.clientX / window.innerWidth - .5) * 2;
          const y = (event.clientY / window.innerHeight - .5) * 2;
          backdrop.style.setProperty('--drift-x', `${x * 7}px`);
          backdrop.style.setProperty('--drift-y', `${y * 5}px`);
        }, { passive: true });
      }
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
